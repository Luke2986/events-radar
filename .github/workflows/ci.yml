name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Do NOT pin `version:` here — `packageManager: pnpm@10.13.1` in the
      # root package.json is the single source of truth. Passing both causes
      # ERR_PNPM_BAD_PM_VERSION when the values diverge.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install scraper dependencies (runtime + test)
        # scraper/scraper.py imports psycopg2, requests, bs4 at module level,
        # so pytest collection fails without the runtime deps. These mirror
        # pyproject.toml [project].dependencies minus google-generativeai
        # and python-Levenshtein, which are only needed by the llm-marked
        # tests (deselected in CI).
        #
        # Use `python -m pip` (not bare `pip`) to guarantee the packages land
        # in the same interpreter that `python -m pytest` will use — avoids
        # PATH-ordering surprises when pnpm spawns the test:scraper script.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psycopg2-binary requests beautifulsoup4 lxml
          python -c "import psycopg2, requests, bs4; print('scraper deps OK')"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test (workspaces)
        run: pnpm run test

      - name: Test (scraper)
        run: pnpm run test:scraper

      - name: Audit (production deps)
        run: pnpm audit --prod --audit-level=moderate
